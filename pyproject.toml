[project]
name = "eagle-anonymization-demo"
version = "0.1.0"
description = "Small CSV → SQL → PluRel → synthetic text conference demo"
requires-python = ">=3.12,<3.13"
dependencies = ["plurel==1.1.0", "openai>=2,<3", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
